<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s;
        }

      </style>
</head>
<body>

    <div class="container">
        <h1 id="question-text">Сосал?</h1>
        <button class="btn btn-yes" onclick="sayYes()">Да</button>
        <button class="btn btn-no" onclick="sayNo()">Нет</button>
        <div id="result"></div>
    </div>

    <script>
        function sayYes() {
            document.getElementById('result').innerText = "Ну молодец, поздравляю";
        }

        function sayNo() {
            document.getElementById('result').innerText = "Братан, ты точно уверен?";
        }
    </script>

</body>
</html>
