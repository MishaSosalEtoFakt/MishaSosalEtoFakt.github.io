<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опрос</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #928DAB);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transform: scale(0.9);
            animation: fadeInScale 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        h1 {
            font-size: 26px;
            color: #222;
            margin-bottom: 35px;
            line-height: 1.4;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(118, 75, 162, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .screen.active {
            display: block;
            opacity: 1;
        }

        .fullscreen-text {
            font-size: 65px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            animation: popText 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popText {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран 1: Главный вопрос -->
        <div id="screen-1" class="screen active">
            <h1>Даша сосала?</h1>
            <div class="btn-group">
                <button class="btn" onclick="goToScreen('screen-2-yes')">Да</button>
                <button class="btn" onclick="goToScreen('screen-2-no')">Нет</button>
            </div>
        </div>

        <!-- Экран 2 (если Да) -->
        <div id="screen-2-yes" class="screen">
            <h1>Пока не доказано, не ебёт, что сказано</h1>
            <div class="btn-group">
                <button class="btn" onclick="goToScreen('screen-3')">Перейти дальше</button>
            </div>
        </div>

        <!-- Экран 2 (если Нет) -->
        <div id="screen-2-no" class="screen">
            <h1>Ты меня собралась наёбывать?</h1>
            <div class="btn-group">
                <button class="btn" onclick="goToScreen('screen-3')">Перейти дальше</button>
            </div>
        </div>

        <!-- Экран 3: Финальный вопрос -->
        <div id="screen-3" class="screen">
            <h1>Ладно, я заебался кодить эту хуйню. Понравилось?</h1>
            <div class="btn-group">
                <button class="btn" onclick="showFinal('pi')">Да</button>
                <button class="btn" onclick="showFinal('mi')">Нет</button>
            </div>
        </div>

        <!-- Экран 4: Ответ ДА -->
        <div id="screen-final-yes" class="screen">
            <div class="fullscreen-text">Пизда</div>
        </div>

        <!-- Экран 4: Ответ НЕТ -->
        <div id="screen-final-no" class="screen">
            <div class="fullscreen-text">Минет</div>
        </div>
    </div>

    <script>
        function goToScreen(screenId) {
            const currentScreen = document.querySelector('.screen.active');
            currentScreen.style.opacity = '0';
            
            setTimeout(() => {
                currentScreen.classList.remove('active');
                const nextScreen = document.getElementById(screenId);
                nextScreen.classList.add('active');
                nextScreen.style.opacity = '1';
            }, 200);
        }

        function showFinal(type) {
            const currentScreen = document.querySelector('.screen.active');
            currentScreen.style.opacity = '0';

            setTimeout(() => {
                currentScreen.classList.remove('active');
                if (type === 'pi') {
                    const target = document.getElementById('screen-final-yes');
                    target.classList.add('active');
                    target.style.opacity = '1';
                } else {
                    const target = document.getElementById('screen-final-no');
                    target.classList.add('active');
                    target.style.opacity = '1';
                }
            }, 200);
        }
    </script>

</body>
</html>
