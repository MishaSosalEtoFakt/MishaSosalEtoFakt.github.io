<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s;
            background-color: #007bff;
            color: white;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .fullscreen-text {
            font-size: 60px;
            font-weight: bold;
            color: #ff334b;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Экран 1: Главный вопрос -->
        <div id="screen-1" class="screen active">
            <h1>Даша сосала?</h1>
            <button class="btn" onclick="goToScreen('screen-2-yes')">Да</button>
            <button class="btn" onclick="goToScreen('screen-2-no')">Нет</button>
        </div>

        <!-- Экран 2 (если Да) -->
        <div id="screen-2-yes" class="screen">
            <h1>Пока не доказано, не ебёт, что сказано</h1>
            <button class="btn" onclick="goToScreen('screen-3')">Перейти дальше</button>
        </div>

        <!-- Экран 2 (если Нет) -->
        <div id="screen-2-no" class="screen">
            <h1>Ты меня собралась наёбывать?</h1>
            <button class="btn" onclick="goToScreen('screen-3')">Перейти дальше</button>
        </div>

        <!-- Экран 3: Финальный вопрос -->
        <div id="screen-3" class="screen">
            <h1>Ладно, я заебался кодить эту хуйню. Понравилось?</h1>
            <button class="btn" onclick="showFinal('pi')">Да</button>
            <button class="btn" onclick="showFinal('mi')">Нет</button>
        </div>

        <!-- Экран 4: Ответ ДА -->
        <div id="screen-final-yes" class="screen">
            <div class="fullscreen-text">Пизда</div>
        </div>

        <!-- Экран 4: Ответ НЕТ -->
        <div id="screen-final-no" class="screen">
            <div class="fullscreen-text">Минет</div>
        </div>
    </div>

    <script>
        function goToScreen(screenId) {
            // Скрыть все экраны
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));
            
            // Показать нужный
            document.getElementById(screenId).classList.add('active');
        }

        function showFinal(type) {
            const screens = document.querySelectorAll('.screen');
            screens.forEach(s => s.classList.remove('active'));

            if (type === 'pi') {
                document.getElementById('screen-final-yes').classList.add('active');
            } else {
                document.getElementById('screen-final-no').classList.add('active');
            }
        }
    </script>

</body>
</html>
