<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #f7f9fc;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh;
  }
  .profile-card {
    background-color: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    padding: 40px;
    width: 350px;
    text-align: center;
  }
  .avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
  }
  .name {
    font-size: 24px;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
  }
  .bio {
    font-size: 14px;
    color: #666;
    margin-bottom: 30px;
    line-height: 1.5;
  }
  .button-link {
    display: block;
    width: 80%;
    margin: 0 auto 15px auto;
    padding: 12px 20px;
    border-radius: 10px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    transition: background-color 0.3s;
  }
  .btn-tg { background-color: #0088cc; }
  .btn-inst { background-color: #E1306C; }
  .btn-music { background-color: #1DB954; }
</style>
<div class="profile-card">
  <img src="https://via.placeholder.com/150" alt="Аватар" class="avatar">
  <div class="name">Ваше Имя</div>
  <div class="bio">Краткая информация о себе, ваши увлечения, музыка и ссылки.</div>
  <a href="#" class="button-link btn-tg">Telegram</a>
  <a href="#" class="button-link btn-inst">Instagram</a>
  <a href="#" class="button-link btn-music">Любимая музыка</a>
</div>
